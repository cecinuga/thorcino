[project]
name = "thorcino"
version = "1.0.0"
description = "A minimal, educational deep-learning framework built from scratch on top of NumPy"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "cecinuga", email = "cecinuga.tdb@gmail.com" },
]
keywords = ["deep-learning", "autograd", "neural-network", "numpy", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.5.0",
    "graphviz>=0.21",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.3",
]

[project.urls]
Repository = "https://github.com/cecinuga/tiny-torch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thorcino"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.11.0",
    "myst_nb>=0.19.0",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python = "./.venv"
